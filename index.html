<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Artikel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== SIDEBAR RIWAYAT ===== -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Riwayat Artikel</h2>
      <button class="btn-icon" id="sidebarClose" aria-label="Tutup sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <ul class="history-list" id="historyList">
      <!-- Diisi oleh JS -->
      <li class="history-empty" id="historyEmpty">Belum ada riwayat artikel.</li>
    </ul>
  </aside>

  <!-- ===== HEADER ===== -->
  <header class="app-header">
    <button class="btn-icon" id="btnSidebar" aria-label="Buka riwayat">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="app-logo">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      <span>Generate Artikel</span>
    </div>
    <button class="btn-icon" id="btnSettings" aria-label="Pengaturan">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <!-- ===== TAB BAR (mobile only) ===== -->
  <nav class="tab-bar" id="tabBar">
    <button class="tab-btn active" data-tab="input">Input</button>
    <button class="tab-btn" data-tab="result">Hasil Artikel</button>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="app-main">

    <!-- Panel Input -->
    <section class="panel panel-input active" id="panelInput">
      <div class="panel-inner">
        <h2 class="panel-heading">Input Artikel</h2>

        <form id="articleForm" novalidate>
          <!-- Judul -->
          <div class="form-group">
            <label class="form-label" for="inputJudul">
              Judul <span class="required">*</span>
            </label>
            <input
              type="text"
              id="inputJudul"
              class="form-control"
              placeholder="Masukkan judul artikel..."
              autocomplete="off"
            />
            <span class="form-error" id="errorJudul"></span>
          </div>

          <!-- Lead / Pembuka -->
          <div class="form-group">
            <label class="form-label" for="inputLead">
              Lead / Pembuka <span class="optional">(opsional)</span>
            </label>
            <textarea
              id="inputLead"
              class="form-control"
              rows="3"
              placeholder="Tuliskan kalimat pembuka atau konteks artikel..."
            ></textarea>
          </div>

          <!-- Sub Tema -->
          <div class="form-group">
            <label class="form-label" for="inputSubTema">
              Sub Tema <span class="required">*</span>
            </label>
            <input
              type="text"
              id="inputSubTema"
              class="form-control"
              placeholder="Contoh: teknologi, kesehatan, pendidikan..."
              autocomplete="off"
            />
            <span class="form-error" id="errorSubTema"></span>
          </div>

          <!-- Panjang Artikel -->
          <div class="form-group">
            <label class="form-label" for="inputPanjang">
              Panjang Artikel (kata)
            </label>
            <input
              type="number"
              id="inputPanjang"
              class="form-control"
              value="1000"
              min="100"
              max="5000"
              step="100"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btnGenerate">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Buat Artikel
          </button>
        </form>
      </div>
    </section>

    <!-- Panel Hasil Artikel -->
    <section class="panel panel-result" id="panelResult">
      <div class="panel-inner">
        <div class="result-header">
          <h2 class="panel-heading">Hasil Artikel</h2>
          <div class="result-actions" id="resultActions">
            <button class="btn btn-sm btn-outline" id="btnCopy" title="Salin artikel">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Salin
            </button>
            <button class="btn btn-sm btn-outline" id="btnRegenerate" title="Generate ulang">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
              Generate Ulang
            </button>
            <button class="btn btn-sm btn-danger" id="btnDelete" title="Hapus artikel">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
              Hapus
            </button>
          </div>
        </div>

        <div class="result-body" id="resultBody">
          <div class="result-empty" id="resultEmpty">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <p>Artikel akan muncul di sini setelah Anda mengisi form dan menekan <strong>Buat Artikel</strong>.</p>
          </div>
          <div class="result-content" id="resultContent"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== MODAL PENGATURAN ===== -->
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" id="modalSettings" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">Pengaturan</h2>
      <button class="btn-icon" id="modalClose" aria-label="Tutup pengaturan">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <!-- API Key -->
      <div class="form-group">
        <label class="form-label" for="settingApiKey">API Key</label>
        <div class="input-password-wrap">
          <input
            type="password"
            id="settingApiKey"
            class="form-control"
            placeholder="Masukkan API Key WeizeRouter..."
            autocomplete="off"
          />
          <button type="button" class="btn-password-toggle" id="btnToggleApiKey" aria-label="Tampilkan/sembunyikan API Key">
            <svg class="icon-eye" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
      </div>

      <!-- Model ID -->
      <div class="form-group">
        <label class="form-label" for="settingModelId">Model ID</label>
        <input
          type="text"
          id="settingModelId"
          class="form-control"
          placeholder="wz/gpt-5.5"
          autocomplete="off"
        />
      </div>

      <!-- Prompt Dasar -->
      <div class="form-group">
        <label class="form-label" for="settingPrompt">Prompt Dasar (System Prompt)</label>
        <div class="prompt-hint">
          Variabel yang tersedia:
          <code>{{judul}}</code>
          <code>{{sub_tema}}</code>
          <code>{{lead}}</code>
          <code>{{panjang}}</code>
        </div>
        <textarea
          id="settingPrompt"
          class="form-control prompt-textarea"
          rows="8"
          placeholder="Contoh: Kamu adalah penulis artikel profesional. Tulis artikel berjudul '{{judul}}' dengan sub tema '{{sub_tema}}'. {{lead ? 'Pembuka: ' + lead : ''}} Panjang artikel sekitar {{panjang}} kata."
        ></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" id="btnSettingsCancel">Batal</button>
      <button type="button" class="btn btn-primary" id="btnSettingsSave">Simpan Pengaturan</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
